name: Collect news
on:
  schedule:
    # 22:00 UTC on the previous day = 07:00 JST. GitHub may delay scheduled runs.
    - cron: '0 22 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect_news.py
      - name: Save collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/news.json docs/data/status.json collector-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news data"
            git push origin HEAD:main
          fi
  publish:
    needs: collect
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
