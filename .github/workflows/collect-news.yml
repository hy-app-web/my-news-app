name: Collect news
on:
  schedule:
    # UTC 22:00 / 03:00 / 10:00 = JST 07:00 / 12:00 / 19:00. May be delayed.
    - cron: '0 3,10,22 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Refresh after entering the workflow concurrency group, including reruns.
      - name: Refresh main before collecting
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/collect_news.py
      - name: Save collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/news.json docs/data/status.json collector-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news data"
            # No force/rebase of generated JSON: if main changed, fail safely.
            # A rerun checks out the latest main and recalculates additions.
            git push origin HEAD:main
          fi
  publish:
    needs: collect
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
